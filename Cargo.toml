[package]
name = "myke"
version = "1.2.2"
edition = "2024"
repository = "https://github.com/Multigriffes-org/myke"
description = "This is a custom CLI to automatically compile small C/C++ project"
license = "MIT OR Apache-2.0"

[dependencies]
crossbeam = "0.8.5"
rayon = "1.12.0"
regex = "1.13.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
